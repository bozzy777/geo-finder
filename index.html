<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEO-SPECTRE — OSINT</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
:root{--bg:#0a0b0c;--panel:#131517;--grn:#3dff7a;--blu:#8fd4ff;--txt:#c9cfd6;--dim:#6b727c;--line:#26282c;--glow:0 0 10px rgba(61,255,122,.45);--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);min-height:100vh}
header{padding:20px;border-bottom:1px solid var(--line);text-align:center;color:var(--grn)}
.stage{max-width:1000px;margin:40px auto;padding:0 20px}
.dropzone{border:1px dashed var(--line);padding:40px;text-align:center;cursor:pointer;border-radius:8px;background:var(--panel);transition:.3s}
.dropzone:hover{border-color:var(--grn);box-shadow:var(--glow)}
.hidden-input{display:none}
.preview-wrap{display:none;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.preview-img{width:100%;border-radius:8px;border:1px solid var(--line)}
.term{background:#000;border:1px solid var(--line);border-radius:8px;padding:15px;font-size:12px;height:400px;overflow-y:auto;line-height:1.8}
.tl-line{margin-bottom:5px}
.tl-ok{color:var(--grn)}.tl-warn{color:#ffb224}.tl-dim{color:var(--dim)}
.results{display:none;margin-top:30px;border:1px solid var(--grn);padding:20px;border-radius:8px;background:rgba(61,255,122,.05)}
#map{height:400px;width:100%;margin-top:20px;border-radius:8px;filter:grayscale(.8)}
button{padding:10px 20px;background:var(--grn);color:#000;border:none;border-radius:4px;font-weight:bold;cursor:pointer;margin-top:10px}
</style>
</head>
<body>

<header>
  <h1>GEO-SPECTRE v4</h1>
  <p style="font-size:12px;color:var(--dim)">100% Client-Side AI & EXIF Engine</p>
</header>

<main class="stage">
  <div class="dropzone" id="dropzone">
    <h2>Перетащите фото сюда или нажмите</h2>
    <p style="font-size:12px;color:var(--dim);margin-top:10px">Анализ происходит прямо в браузере. Без серверов и ключей.</p>
  </div>
  <input type="file" id="fileInput" class="hidden-input" accept="image/*">

  <div class="preview-wrap" id="previewWrap">
    <img id="previewImg" class="preview-img">
    <div class="term" id="termBody"></div>
  </div>

  <div class="results" id="results">
    <h3>РЕЗУЛЬТАТЫ АНАЛИЗА</h3>
    <div id="cards" style="margin-top:15px;font-size:13px;line-height:1.8"></div>
    <div id="map"></div>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
let map = null;

function log(msg, cls='tl-ok'){
  const d = document.createElement('div');
  d.className = 'tl-line ' + cls;
  d.innerHTML = '> ' + msg;
  $('#termBody').appendChild(d);
  $('#termBody').scrollTop = $('#termBody').scrollHeight;
}

$('#dropzone').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => {
  if(e.target.files[0]) processFile(e.target.files[0]);
};

async function processFile(file){
  $('#dropzone').style.display = 'none';
  $('#previewWrap').style.display = 'grid';
  $('#termBody').innerHTML = '';
  
  const url = URL.createObjectURL(file);
  $('#previewImg').src = url;
  
  log('Файл загружен: ' + file.name);
  
  // 1. EXIF
  log('Поиск EXIF/GPS...', 'tl-dim');
  let meta = {};
  try { meta = await exifr.parse(file, { tiff: true, xmp: true, gps: true }); } catch(e){}
  
  let foundGps = false;
  if(meta && meta.latitude){
    log(`GPS найден: ${meta.latitude}, ${meta.longitude}`);
    foundGps = true;
    showResult(`<b>Точные координаты (EXIF):</b> ${meta.latitude}, ${meta.longitude}`);
    initMap(meta.latitude, meta.longitude);
  } else {
    log('GPS в EXIF не найден. Переход к ИИ...', 'tl-warn');
  }

  // 2. AI (MobileNet в браузере)
  log('Загрузка нейросети (MobileNet)...', 'tl-dim');
  try {
    const model = await mobilenet.load();
    log('Нейросеть загружена. Анализ изображения...');
    const img = $('#previewImg');
    const predictions = await model.classify(img);
    
    let aiText = '<b>Что видит ИИ:</b><br>';
    predictions.forEach(p => {
      aiText += `- ${p.className} (${(p.probability*100).toFixed(1)}%)<br>`;
      log(`ИИ: ${p.className}`, 'tl-dim');
    });
    showResult(aiText);
  } catch(e) {
    log('Ошибка ИИ: ' + e.message, 'tl-warn');
  }
  
  // 3. OCR (Tesseract)
  log('Распознавание текста (OCR)...', 'tl-dim');
  try {
    const worker = await Tesseract.createWorker('eng+rus');
    const { data: { text } } = await worker.recognize(file);
    const cleanText = text.replace(/\s+/g, ' ').trim();
    if(cleanText){
      log('Текст найден: ' + cleanText.substring(0, 50) + '...');
      showResult(`<b>Найденный текст:</b> ${cleanText}`);
    } else {
      log('Текст не найден.', 'tl-dim');
    }
  } catch(e) {
    log('Ошибка OCR: ' + e.message, 'tl-warn');
  }

  if(!foundGps){
    showResult(`<b>Визуальный анализ:</b> Координаты не найдены. Проверьте похожие места через <a href="https://yandex.ru/images/search" target="_blank" style="color:var(--grn)">Яндекс.Картинки</a> или <a href="https://lens.google.com" target="_blank" style="color:var(--grn)">Google Lens</a>.`);
  }
}

function showResult(html){
  $('#results').style.display = 'block';
  const div = document.createElement('div');
  div.innerHTML = html;
  $('#cards').appendChild(div);
}

function initMap(lat, lng){
  if(!map){
    map = L.map('map').setView([lat, lng], 14);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
  } else {
    map.setView([lat, lng], 14);
  }
  L.marker([lat, lng]).addTo(map);
}
</script>
</body>
</html>
